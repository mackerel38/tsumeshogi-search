name: Pawn shield safety analysis
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Search seconds per candidate and policy
        required: true
        default: '180'
      nodes:
        description: Maximum expanded positions per job
        required: true
        default: '300000'
      resume_run:
        description: Prior run number, or zero to start fresh
        required: true
        default: '0'
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: echo "image=ghcr.io/${REPO,,}/search:${COMMIT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
  prove:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        candidate: [shield-king44, shield-king34]
        policy: [capture, sparse]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: inputs.resume_run != '0'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.resume_run }}
          pattern: shield-safety-${{ matrix.candidate }}-${{ matrix.policy }}-${{ inputs.resume_run }}
          path: resume
          merge-multiple: true
      - name: Validate and search
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          CANDIDATE: ${{ matrix.candidate }}
          POLICY: ${{ matrix.policy }}
          SECONDS_LIMIT: ${{ inputs.seconds }}
          NODES_LIMIT: ${{ inputs.nodes }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          python -c 'import os; s=int(os.environ["SECONDS_LIMIT"]); n=int(os.environ["NODES_LIMIT"]); r=int(os.environ["RESUME_RUN"]); assert 1 <= s <= 600 and 10 <= n <= 1000000 and r >= 0'
          mkdir -p results
          if [ "$RESUME_RUN" != 0 ]; then test -f resume/state.json.gz; gzip -dc resume/state.json.gz > results/state.json; fi
          docker run --rm --memory 5g --entrypoint python -v "$PWD/results:/results" "$IMAGE" research/nomate_safety_search.py --source "candidates/dynamic-ray/${CANDIDATE}.json" --output /results/state.json --policy "$POLICY" --seconds "$SECONDS_LIMIT" --nodes "$NODES_LIMIT"
      - name: Compress result
        if: always()
        run: |
          if test -f results/state.json; then gzip -c results/state.json > results/state.json.gz; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shield-safety-${{ matrix.candidate }}-${{ matrix.policy }}-${{ github.run_id }}
          path: results/state.json.gz
          retention-days: 30
          if-no-files-found: warn
