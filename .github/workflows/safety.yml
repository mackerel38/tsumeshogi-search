name: Resume defender safety proof search
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Search seconds per strategy
        required: true
        default: '45'
      nodes:
        description: Total expanded-node cap including saved seed
        required: true
        default: '700000'
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: echo "image=ghcr.io/${REPO,,}/search:${COMMIT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
  prove:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        policy: [capture, sparse]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore saved graph and search
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          POLICY: ${{ matrix.policy }}
          SECONDS_LIMIT: ${{ inputs.seconds }}
          NODES_LIMIT: ${{ inputs.nodes }}
        run: |
          mkdir -p results
          gzip -dc candidates/safety/pawn2-stock1-seed.json.gz > results/state.json
          docker run --rm --memory 5g --entrypoint python -v "$PWD/results:/results" "$IMAGE" research/nomate_safety_search.py --source candidates/safety/pawn2-stock1.json --output /results/state.json --policy "$POLICY" --rerank --seconds "$SECONDS_LIMIT" --nodes "$NODES_LIMIT"
      - name: Compress checkpoint
        if: always()
        run: gzip -c results/state.json > results/state.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-${{ matrix.policy }}-${{ github.run_id }}
          path: results/state.json.gz
          retention-days: 30
          if-no-files-found: error
