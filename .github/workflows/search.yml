name: Parallel restoration search
on:
  workflow_dispatch:
    inputs:
      request:
        description: 'JSON: candidates, seconds, nodes, optional resume_run'
        required: true
        default: '{"candidates":["horse-5d"],"seconds":60,"nodes":200000}'
  issues:
    types: [opened, reopened]
permissions:
  contents: read
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.issue.title, '[search]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python scripts/plan.py
  image:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: echo "image=ghcr.io/${REPO,,}/search:${COMMIT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  search:
    needs: [plan, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: matrix.resume_run != 0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ matrix.resume_run }}
          pattern: search-${{ matrix.candidate }}-*
          path: resume
      - name: Search
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          CANDIDATE: ${{ matrix.candidate }}
          SECONDS_LIMIT: ${{ matrix.seconds }}
          NODES_LIMIT: ${{ matrix.nodes }}
          SEARCH_COMMIT: ${{ github.sha }}
          SEARCH_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p results resume
          docker run --rm -e SEARCH_COMMIT -e SEARCH_RUN_ID -v "$PWD/results:/results" -v "$PWD/resume:/resume:ro" "$IMAGE" --candidate "$CANDIDATE" --seconds "$SECONDS_LIMIT" --nodes "$NODES_LIMIT" --resume /resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-${{ matrix.candidate }}-${{ github.run_id }}
          path: results/
          retention-days: 30
          if-no-files-found: error
